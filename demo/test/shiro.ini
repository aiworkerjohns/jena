#
# Shiro configuration for the DEMO ONLY. Passed with --shiro, which takes
# precedence over FUSEKI_SHIRO and over the default that Fuseki unpacks into
# run/shiro.ini.
#
# The only difference from that default is the /$/config line below.
#
# ---------------------------------------------------------------------------
# DO NOT COPY THIS INTO A DEPLOYMENT.
#
# /$/config serves the server's configuration file verbatim - TDB2 and Lucene
# paths, shape definitions, and anything else the file happens to contain. It
# is exposed to anyone here because the demo is a throwaway local server with
# synthetic data.
#
# In a real deployment, leave /$/config under the default "/$/** =
# localhostFilter", or put it behind real authentication:
#
#   /$/** = authcBasic,user[admin]
#
# ...with an actual password in [users], not the sample one below. Note that
# the shipped default gate is network position, not authentication: nothing in
# the default configuration asks anyone for a password.
# ---------------------------------------------------------------------------

[main]
ssl.enabled = false

plainMatcher=org.apache.shiro.authc.credential.SimpleCredentialsMatcher
localhostFilter=org.apache.jena.fuseki.authz.LocalhostFilter

[users]
# Sample credentials from the stock file; unused, because nothing below
# requires authentication.
user1=passwd1

[roles]

[urls]
## Control functions open to anyone
/$/server  = anon
/$/ping    = anon
/$/metrics = anon

## Demo only: lets the demo app read the running configuration when the browser
## reaches Fuseki directly rather than through the app's same-origin proxy.
## Through the proxy this is unnecessary - the proxy connects from localhost and
## satisfies the filter below.
/$/config    = anon
/$/config/** = anon

## and the rest are restricted to localhost.
/$/** = localhostFilter

# Everything else
/**=anon
